[bumpversion]
current_version = 0.3.0
commit = False
tag = False
parse = (?P<major>\d+)\.(?P<minor>\d+)\.(?P<patch>\d+)((?P<pre_l>a|b|rc)(?P<pre_n>\d+))?
serialize =
	{major}.{minor}.{patch}{pre_l}{pre_n}
	{major}.{minor}.{patch}

[bumpversion:part:pre_l]
first_value = final
optional_value = final
values =
	final
	a
	b
	rc

[bumpversion:file:lazypredict/__init__.py]
search = __version__ = '{current_version}'
replace = __version__ = '{new_version}'

[bumpversion:file:recipe/meta.yaml]
search = {{% set version = "{current_version}" %}}
replace = {{% set version = "{new_version}" %}}

[bumpversion:file:CITATION.cff]
search = version: {current_version}
replace = version: {new_version}
