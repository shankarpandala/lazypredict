name: Conda Build

on:
  push:
    branches: [dev, master]
  pull_request:
    branches: [dev, master]

permissions:
  contents: read

concurrency:
  group: conda-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conda-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Miniforge (conda-forge only)
        uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          python-version: '3.12'
          channels: conda-forge
          conda-remove-defaults: 'true'

      # Since conda 26.3.1, `conda build` is only available when the
      # conda-build plugin lives in the *base* environment; conda no longer
      # discovers `conda-*` executables from the activated environment's PATH.
      - name: Install conda-build into the base environment
        run: conda install -n base -y conda-build

      - name: Build conda package
        run: conda build recipe/ --no-anaconda-upload

      - name: Verify package contents
        run: |
          PKG=$(conda build recipe/ --output)
          echo "Built package: $PKG"
          test -f "$PKG"
