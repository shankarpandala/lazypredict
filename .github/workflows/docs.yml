name: Documentation

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]
    types: [opened, synchronize, reopened, ready_for_review, closed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  # Pull requests get their own group per PR. The "closed" event of a merged
  # PR runs with github.ref set to the base branch, so a shared ref-based
  # group let it cancel the deployment of the merge itself.
  group: docs-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'push' || (github.event.action != 'closed' && github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: |
          pip install -e .
          pip install -r docs/requirements.txt
      - name: Build documentation
        run: mkdocs build --strict
      - uses: actions/upload-artifact@v7
        with:
          name: documentation
          path: site/

  preview:
    # Deploy every (non-draft) PR to a preview path on gh-pages and
    # clean it up when the PR is closed. Pull requests from forks get a
    # read-only GITHUB_TOKEN and cannot push to gh-pages, so they only run
    # the `build` job above.
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.draft == false
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      # Needed on "closed" too: removing the preview pushes to gh-pages
      # from this checkout.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        if: github.event.action != 'closed'
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        if: github.event.action != 'closed'
        run: |
          pip install -e .
          pip install -r docs/requirements.txt
      - name: Build documentation
        if: github.event.action != 'closed'
        run: mkdocs build --strict
      - name: Deploy PR preview
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: ./site/
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          action: auto

  deploy:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/dev')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: |
          pip install -e .
          pip install -r docs/requirements.txt
      - name: Build documentation
        run: mkdocs build --strict
      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: site
          branch: gh-pages
          clean-exclude: pr-preview/**
