name: Publish to PyPI

# Runs when a GitHub release is published (the tag must match
# lazypredict.__version__, see CONTRIBUTING.md "Releasing"). It can also be
# run manually for an existing tag: to retry after a transient PyPI outage,
# or to release a pushed tag, in which case the GitHub release is created
# once the upload has succeeded.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish, e.g. v0.4.0"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  verify-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Check that the release tag matches the package version
        run: python .github/scripts/check_release_version.py "$RELEASE_TAG"

  test:
    needs: verify-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'
      - run: pip install -e ".[test]"
      - name: Run tests before publishing
        run: pytest

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: pip install build twine
      - name: Build sdist and wheel
        run: python -m build
      - name: Validate distributions
        run: twine check --strict dist/*
      - name: Smoke-test the built wheel
        run: |
          VERSION="${RELEASE_TAG#v}"
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install "dist/lazypredict-${VERSION}-py3-none-any.whl"
          # Run outside the checkout so that the wheel, not ./lazypredict, is imported.
          cd "$RUNNER_TEMP"
          /tmp/smoke/bin/python - "$VERSION" << 'EOF'
          import importlib, pkgutil, sys
          import lazypredict
          assert lazypredict.__file__.startswith(sys.prefix), lazypredict.__file__
          assert lazypredict.__version__ == sys.argv[1], lazypredict.__version__
          for module in pkgutil.walk_packages(lazypredict.__path__, "lazypredict."):
              importlib.import_module(module.name)
          EOF
          /tmp/smoke/bin/lazypredict --version
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/lazypredict/
    permissions:
      id-token: write  # Required for OIDC Trusted Publishers
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  attach-to-release:
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Attach distributions to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            # Manual run for a pushed tag: create the release now that the
            # package is on PyPI. Releases created with GITHUB_TOKEN do not
            # trigger this workflow again.
            flags=()
            if [[ "${RELEASE_TAG#v}" =~ (a|b|rc)[0-9]+$ ]]; then flags+=(--prerelease); fi
            gh release create "$RELEASE_TAG" dist/* --verify-tag --generate-notes \
              --title "${RELEASE_TAG#v}" --repo "$GITHUB_REPOSITORY" "${flags[@]}"
          fi
