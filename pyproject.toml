[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lazypredict"
dynamic = ["version"]
description = "Lazy Predict helps build a lot of basic models without much code and helps understand which models work better without any parameter tuning"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "Shankar Rao Pandala", email = "shankar.pandala@live.com" },
]
keywords = [
    "machine-learning",
    "automl",
    "model-selection",
    "scikit-learn",
    "time-series-forecasting",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "click>=7.0",
    "scikit-learn>=1.2",
    "pandas>=1.5",
    "tqdm>=4.0",
    "joblib>=1.0",
    "numpy>=1.23",
]

[project.optional-dependencies]
boost = [
    "xgboost>=1.5",
    "lightgbm>=3.0",
    "catboost>=1.0",
]
encoders = [
    "category_encoders>=2.0",
]
mlflow = [
    "mlflow>=2.0.0",
]
timeseries = [
    "statsmodels>=0.13",
    "pmdarima>=2.0",
]
deeplearning = [
    "torch>=2.0",
]
foundation = [
    "timesfm[torch]>=2.0",
]
tune = [
    "optuna>=3.0",
]
viz = [
    "matplotlib>=3.5",
]
explain = [
    "shap>=0.42",
]
interpret = [
    "interpret>=0.4",
]
flaml = [
    "flaml[automl]>=2.0",
]
spark = [
    "pyspark>=3.3",
]
all = [
    "lazypredict[boost,encoders,mlflow,timeseries,deeplearning,foundation,tune,viz,explain,interpret]",
]
test = [
    "pytest>=7",
    "pytest-cov>=4",
    "xgboost>=1.5",
    "lightgbm>=3.0",
    "statsmodels>=0.13",
    "pmdarima>=2.0",
    "optuna>=3.0",
    "matplotlib>=3.5",
    "category_encoders>=2.0",
]
dev = [
    "lazypredict[test]",
    "flake8>=6",
    "mypy>=1.0",
    "build",
    "twine",
]

[project.scripts]
lazypredict = "lazypredict.cli:main"

[project.urls]
Homepage = "https://github.com/shankarpandala/lazypredict"
Documentation = "https://shankarpandala.github.io/lazypredict/"
Repository = "https://github.com/shankarpandala/lazypredict"
Issues = "https://github.com/shankarpandala/lazypredict/issues"
Changelog = "https://github.com/shankarpandala/lazypredict/blob/dev/HISTORY.md"

[tool.setuptools.dynamic]
version = {attr = "lazypredict.__version__"}

[tool.setuptools.packages.find]
include = ["lazypredict*"]

[tool.setuptools.package-data]
lazypredict = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
